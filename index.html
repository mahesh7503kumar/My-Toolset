<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        var t = localStorage.getItem("appTheme");
        var sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (t === "dark" || (!t && sys)) {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
    <title>My Toolset</title>
    <meta name="description" content="Fast, Private, Works Offline - 50+ Tools in One Place for Image, PDF, Text, QR, Daily, and Calculator tasks." />
    <meta property="og:title" content="My Toolset" />
    <meta property="og:description" content="Fast, Private, Works Offline - 50+ Tools in One Place for Image, PDF, Text, QR, Daily, and Calculator tasks." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyToolset" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
